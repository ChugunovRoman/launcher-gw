name: Release CI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

env:
  APP_NAME: "Launcher"

jobs:
  # --- ЭТАП 1: Сборка под Linux ---
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      
      - name: Build
        run: |
          npm ci
          npm run gen-icons
          npm run tauri build
          mkdir -p ./upload
          cp src-tauri/target/release/${{ env.APP_NAME }} ./upload/${{ env.APP_NAME }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: ./upload/${{ env.APP_NAME }}

  # --- ЭТАП 2: Сборка под Windows (параллельно) ---
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Build
        run: |
          npm ci
          npm run gen-icons
          npm run tauri build
          mkdir upload
          copy src-tauri\target\release\${{ env.APP_NAME }}.exe upload\${{ env.APP_NAME }}.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: upload/${{ env.APP_NAME }}.exe

  # --- ЭТАП 3: Создание релиза ---
  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows] # Ждем завершения первых двух шагов
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true # Складывает всё в одну папку

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: "Portable binaries for ${{ env.APP_NAME }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- ЭТАП 4: Обновление launcher-секции индекса ---
  update-index:
    runs-on: ubuntu-latest
    needs: [publish-release]
    environment: production
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true
      - name: Update index.json
        env:
          GH_TOKEN: ${{ secrets.INDEX_UPDATE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd ./release-assets
          WIN_SIZE=$(stat -c%s Launcher.exe)
          LIN_SIZE=$(stat -c%s Launcher)
          BG_ETAG=$(curl -fsSIL "https://github.com/ChugunovRoman/launcher-gw/raw/master/src%2Fstatic%2Fbg.jpg" | tr -d '\r' | awk 'tolower($1)=="etag:"{sub(/^etag:[ \t]*/,""); print}' | tail -n1)
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Global-War-Releases/index/contents/index.json -o meta.json
          SHA=$(jq -r '.sha' meta.json)
          jq -r '.content' meta.json | base64 -d > current.json
          jq --arg tag "$TAG" --arg etag "$BG_ETAG" --argjson ws "$WIN_SIZE" --argjson ls "$LIN_SIZE" '
            .launcher.version = $tag
            | .launcher.bg_etag = (if $etag == "" then null else $etag end)
            | .launcher.assets = [
                {name:"Launcher.exe", platform:"windows", size:$ws, url:("https://github.com/ChugunovRoman/launcher-gw/releases/download/" + $tag + "/Launcher.exe")},
                {name:"Launcher", platform:"linux", size:$ls, url:("https://github.com/ChugunovRoman/launcher-gw/releases/download/" + $tag + "/Launcher")}
              ]
            | .generated_at = (now | todate)' current.json > new.json
          CONTENT=$(base64 -w0 new.json)
          jq -n --arg msg "Update launcher to $TAG" --arg content "$CONTENT" --arg sha "$SHA" \
            '{message:$msg, content:$content, sha:$sha, branch:"master"}' > body.json
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Global-War-Releases/index/contents/index.json -d @body.json
