stages:
  - test
  - build
  - release

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
  APP_NAME: "Launcher"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/
    - .rustup/
    - node_modules/

check-build-linux:
  stage: test
  image: rust:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true
  before_script:
    - apt-get update
    - apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf curl npm
    - rustup default stable
    - npm ci
  script:
    - npm run gen-icons
    - npm run tauri build

check-build-windows:
  stage: test
  image: ivangabriele/tauri:debian-bookworm-20
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true
  before_script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup default stable
    - apt-get update
    - apt-get -y install nsis clang lld llvm
    - rustup target add x86_64-pc-windows-msvc
    - cargo install --locked --quiet cargo-xwin
    - npm ci
  script:
    - npm run gen-icons
    - npm run tauri-build-windows

# macOS builds need a self-hosted runner (GitLab.com has no macOS shared
# runners). Gate on MACOS_RUNNER_ENABLED=true so pipelines never sit in
# "waiting for runner". Requires: rustup, node/npm on the runner.
check-build-macos:
  stage: test
  tags: [macos]
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $MACOS_RUNNER_ENABLED == "true"
      when: manual
      allow_failure: true
  before_script:
    - rustup default stable
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    - npm ci
  script:
    - npm run gen-icons
    - npm run tauri build -- --target universal-apple-darwin

build-linux:
  stage: build
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update
    - apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf curl npm
    - rustup default stable
    - npm ci
  script:
    - npm run gen-icons
    - npm run tauri build
    - mkdir -p ./dist/linux
    - cp src-tauri/target/release/${APP_NAME} ./dist/linux/${APP_NAME}
  artifacts:
    paths:
      - dist/linux/

build-windows:
  stage: build
  image: ivangabriele/tauri:debian-bookworm-20
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup default stable
    - apt-get update
    - apt-get -y install nsis clang lld llvm
    - rustup target add x86_64-pc-windows-msvc
    - cargo install --locked --quiet cargo-xwin
    - npm ci
  script:
    - npm run gen-icons
    - npm run tauri-build-windows
    - mkdir -p ./dist/windows
    - cp src-tauri/target/x86_64-pc-windows-msvc/release/${APP_NAME}.exe ./dist/windows/${APP_NAME}.exe
  artifacts:
    paths:
      - dist/windows/

# macOS build (universal: arm64 + x86_64) on a self-hosted runner with the
# `macos` tag. The published name ${APP_NAME}-macos is the self-update
# contract (EXE_MACOS_NAME in src-tauri/src/consts.rs).
build-macos:
  stage: build
  tags: [macos]
  rules:
    - if: $CI_COMMIT_TAG && $MACOS_RUNNER_ENABLED == "true"
  before_script:
    - rustup default stable
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    - npm ci
  script:
    - npm run gen-icons
    - npm run tauri build -- --target universal-apple-darwin
    - mkdir -p ./dist/macos
    - cp src-tauri/target/universal-apple-darwin/release/${APP_NAME} ./dist/macos/${APP_NAME}-macos
  artifacts:
    paths:
      - dist/macos/

publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build-linux
    - build-windows
    # optional: the job is skipped when MACOS_RUNNER_ENABLED is not "true"
    - job: build-macos
      optional: true
  before_script:
    - apk add --no-cache git curl jq
  script: |
      # 1. Загрузка в Generic Packages
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/linux/${APP_NAME} "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stalker-gw/${CI_COMMIT_TAG}/${APP_NAME}"
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/windows/${APP_NAME}.exe "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stalker-gw/${CI_COMMIT_TAG}/${APP_NAME}.exe"
      # macOS is built only when a macos runner is registered (MACOS_RUNNER_ENABLED)
      if [ -f dist/macos/${APP_NAME}-macos ]; then
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/macos/${APP_NAME}-macos "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stalker-gw/${CI_COMMIT_TAG}/${APP_NAME}-macos"
      fi
  release:
    name: 'Release $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    description: 'Portable binaries for GW Launcher'
    assets:
      links:
        - name: 'Linux'
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stalker-gw/${CI_COMMIT_TAG}/${APP_NAME}"
        - name: 'Windows'
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stalker-gw/${CI_COMMIT_TAG}/${APP_NAME}.exe"
        # Points at the generic package; 404 on tags published without a
        # macos build (MACOS_RUNNER_ENABLED off). The launcher reads index.json
        # (update-index below), which drops the macos entry in that case.
        - name: 'macOS'
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stalker-gw/${CI_COMMIT_TAG}/${APP_NAME}-macos"

# --- ЭТАП 4: Обновление launcher-секции индекса ---
update-index:
  stage: release
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: publish-release
    - job: build-linux
      artifacts: true
    - job: build-windows
      artifacts: true
    - job: build-macos
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache curl jq coreutils bash
  script: |
    set -euo pipefail
    INDEX_API="${CI_API_V4_URL}/projects/85506224/repository/files/index.json"
    WIN_SIZE=$(wc -c < dist/windows/Launcher.exe)
    LIN_SIZE=$(wc -c < dist/linux/Launcher)
    WIN_SHA=$(sha256sum dist/windows/Launcher.exe | cut -d' ' -f1)
    LIN_SHA=$(sha256sum dist/linux/Launcher | cut -d' ' -f1)
    # macOS is built only when a macos runner is registered. When this tag
    # carries no macOS binary the macos entries are DROPPED (not kept stale):
    # a stale entry would make macOS clients re-download the old binary
    # forever under the new version number. The launcher's updater refuses
    # to offer an update that has no asset for the current platform.
    MAC_SIZE=0
    MAC_SHA=""
    if [ -f dist/macos/Launcher-macos ]; then
      MAC_SIZE=$(wc -c < dist/macos/Launcher-macos)
      MAC_SHA=$(sha256sum dist/macos/Launcher-macos | cut -d' ' -f1)
    fi
    BG_ETAG=$(curl -fsSIL "${CI_API_V4_URL}/projects/75545910/repository/files/data%2Fbg%2Fbg.jpg/raw?ref=master" | tr -d '\r' | awk 'tolower($1)=="etag:"{sub(/^etag:[ \t]*/,""); print}' | tail -n1)
    curl -fsS -H "PRIVATE-TOKEN: ${LAUNCHER_INDEX_TOKEN}" "${INDEX_API}/raw?ref=master" -o current.json
    BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stalker-gw/${CI_COMMIT_TAG}"
    jq --arg tag "$CI_COMMIT_TAG" --arg etag "$BG_ETAG" --arg base "$BASE_URL" \
       --argjson ws "$WIN_SIZE" --argjson ls "$LIN_SIZE" --argjson ms "$MAC_SIZE" \
       --arg wsha "$WIN_SHA" --arg lsha "$LIN_SHA" --arg msha "$MAC_SHA" '
      .launcher.version = $tag
      | .launcher.bg_etag = (if $etag == "" then null else $etag end)
      | .launcher.assets = (
          [
            {name:"Launcher.exe", platform:"windows", size:$ws, sha256:$wsha, url:($base + "/Launcher.exe")},
            {name:"Launcher", platform:"linux", size:$ls, sha256:$lsha, url:($base + "/Launcher")}
          ]
          + (if $ms > 0 then
              [{name:"Launcher-macos", platform:"macos", size:$ms, sha256:$msha, url:($base + "/Launcher-macos")}]
            else
              []
            end)
        )
      | .generated_at = (now | todate)' current.json > new.json
    jq -n --rawfile c new.json --arg msg "Update launcher to ${CI_COMMIT_TAG}" \
      '{content:$c, commit_message:$msg, branch:"master"}' > body.json
    STATUS=$(curl -s -o resp.json -w "%{http_code}" -X PUT -H "PRIVATE-TOKEN: ${LAUNCHER_INDEX_TOKEN}" \
      -H "Content-Type: application/json" "${INDEX_API}" -d @body.json)
    if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
      STATUS2=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "PRIVATE-TOKEN: ${LAUNCHER_INDEX_TOKEN}" \
        -H "Content-Type: application/json" "${INDEX_API}" -d @body.json)
      if [ "$STATUS2" != "201" ]; then echo "PUT=$STATUS POST=$STATUS2"; cat resp.json; exit 1; fi
    fi
